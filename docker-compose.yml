services:
  pinguincrawl:
    build:
      context: .
      args:
        PORT: ${PORT:-3000}
    container_name: pinguincrawl
    # One PORT for both sides of the mapping and for the app inside the container:
    # PORT=6000 in .env (or `PORT=6000 docker compose up -d --build`) gives 6000:6000
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=${PORT:-3000}
    restart: unless-stopped
    # Docker keeps container output forever by default — cap it so logs can't fill the disk
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
